name: render profile panels

on:
  schedule:
    - cron: "17 9 * * *" # diário, 06:17 BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/projects.json, scripts/render.mjs]

permissions:
  contents: read

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # só para commitar os SVGs gerados
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: render
        env:
          GITHUB_TOKEN: ${{ github.token }} # só rate limit; o endpoint lido é /events/public
        run: node scripts/render.mjs
      - name: commit if changed
        run: |
          git add assets README.md
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: render profile panels"
          git push
