<svg xmlns="http://www.w3.org/2000/svg" width="840" height="990" viewBox="0 0 840 990" role="img" aria-label="case-files — sanitized briefs">
<title>case-files — sanitized briefs</title>
<defs>
  
  <clipPath id="win"><rect width="840" height="990" rx="10"/></clipPath>
</defs>
<style>text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}</style>
<g clip-path="url(#win)">
  <rect width="840" height="990" fill="#0d1524"/>
  <rect width="840" height="34" fill="#111b2e"/>
  <line x1="0" y1="34" x2="840" y2="34" stroke="#1f2b40"/>
  <circle cx="20" cy="17" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="34" y="21.5" font-size="12" fill="#8494b0" letter-spacing="0.5">case-files — sanitized briefs</text>
  <text x="822" y="21.5" font-size="12" fill="#8494b0" text-anchor="end">6 files</text>
  <g>
<text x="26" y="62" font-size="12" fill="#8494b0">$ cat /srv/cases/*.md --sanitized</text>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="0.5s" fill="freeze"/><rect x="26" y="80" width="387" height="292" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="42" y="108" font-size="11" fill="#8494b0">HOST-01</text>
    <text x="94.8" y="108" font-size="14" font-weight="700" fill="#d3dceb">gym-app</text>
    <rect x="332.6" y="94" width="64.4" height="19" rx="4" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="364.8" y="107" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="0.5">BUILDING</text><text x="42" y="128" font-size="11.5" fill="#7b8aa3"><tspan fill="#22d3ee">personal</tspan> · Cloudflare Pages / Node API (Docker) …</text><line x1="42" y1="140" x2="397" y2="140" stroke="#1f2b40"/><text x="42" y="162" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="42" y="180" font-size="12" fill="#d3dceb">Log sets and loads at the gym, even with no</text><text x="42" y="198" font-size="12" fill="#d3dceb">signal, and see progress over time.</text><text x="42" y="222" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="42" y="240" font-size="12" fill="#d3dceb">Offline-first PWA syncing to a containerized Node</text><text x="42" y="258" font-size="12" fill="#d3dceb">API; Google sign-in through Supabase Auth.</text><text x="42" y="282" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="42" y="300" font-size="12" fill="#d3dceb">Row-level security on every table, JWTs verified</text><text x="42" y="318" font-size="12" fill="#d3dceb">via JWKS, read-only containers with dropped</text><text x="42" y="336" font-size="12" fill="#d3dceb">capabilities, secret scan in CI.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.52;1" dur="0.62s" fill="freeze"/><rect x="427" y="80" width="387" height="292" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="443" y="108" font-size="11" fill="#8494b0">HOST-02</text>
    <text x="495.8" y="108" font-size="14" font-weight="700" fill="#d3dceb">devhome</text>
    <rect x="746.2" y="94" width="51.8" height="19" rx="4" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="772.1" y="107" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">ONLINE</text><text x="443" y="128" font-size="11.5" fill="#7b8aa3"><tspan fill="#22d3ee">tooling</tspan> · WSL2 / Python / Bash / Claude Code</text><line x1="443" y1="140" x2="798" y2="140" stroke="#1f2b40"/><text x="443" y="162" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="443" y="180" font-size="12" fill="#d3dceb">One environment that rebuilds from scratch and</text><text x="443" y="198" font-size="12" fill="#d3dceb">tells me when it drifts from a secure baseline.</text><text x="443" y="222" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="443" y="240" font-size="12" fill="#d3dceb">Bootstrap scripts, a findings collector with</text><text x="443" y="258" font-size="12" fill="#d3dceb">tickets and accepted-risk rules, a lessons KB and</text><text x="443" y="276" font-size="12" fill="#d3dceb">AI agent skills.</text><text x="443" y="300" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="443" y="318" font-size="12" fill="#d3dceb">Pre-commit secret scanning, findings ranked by</text><text x="443" y="336" font-size="12" fill="#d3dceb">severity, every change closed by a verification</text><text x="443" y="354" font-size="12" fill="#d3dceb">report.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.59;1" dur="0.74s" fill="freeze"/><rect x="26" y="386" width="387" height="274" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="42" y="414" font-size="11" fill="#8494b0">HOST-03</text>
    <text x="94.8" y="414" font-size="14" font-weight="700" fill="#d3dceb">space-agent</text>
    <rect x="332.6" y="400" width="64.4" height="19" rx="4" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="364.8" y="413" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="0.5">BUILDING</text><text x="42" y="434" font-size="11.5" fill="#7b8aa3"><tspan fill="#22d3ee">personal</tspan> · Python / Typer / SQLite / Ollama / Do…</text><line x1="42" y1="446" x2="397" y2="446" stroke="#1f2b40"/><text x="42" y="468" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="42" y="486" font-size="12" fill="#d3dceb">An assistant with memory that runs on my machine</text><text x="42" y="504" font-size="12" fill="#d3dceb">instead of a third-party cloud.</text><text x="42" y="528" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="42" y="546" font-size="12" fill="#d3dceb">Typer CLI over a modular core: SQLite with FTS5</text><text x="42" y="564" font-size="12" fill="#d3dceb">for local search, Ollama for local models,</text><text x="42" y="582" font-size="12" fill="#d3dceb">contracts for MCP and webhooks.</text><text x="42" y="606" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="42" y="624" font-size="12" fill="#d3dceb">Local models by default, configuration by</text><text x="42" y="642" font-size="12" fill="#d3dceb">environment, structured logs for audit.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.65;1" dur="0.86s" fill="freeze"/><rect x="427" y="386" width="387" height="274" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="443" y="414" font-size="11" fill="#8494b0">HOST-04</text>
    <text x="495.8" y="414" font-size="14" font-weight="700" fill="#d3dceb">prova.ai</text>
    <rect x="739.9" y="400" width="58.1" height="19" rx="4" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="768.95" y="413" font-size="10.5" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">STAGING</text><text x="443" y="434" font-size="11.5" fill="#7b8aa3"><tspan fill="#22d3ee">product</tspan> · Next.js / TypeScript / .NET 9 / Docker</text><line x1="443" y1="446" x2="798" y2="446" stroke="#1f2b40"/><text x="443" y="468" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="443" y="486" font-size="12" fill="#d3dceb">Let shoppers preview a garment on themselves</text><text x="443" y="504" font-size="12" fill="#d3dceb">before buying.</text><text x="443" y="528" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="443" y="546" font-size="12" fill="#d3dceb">Split into landing page, web app and .NET API;</text><text x="443" y="564" font-size="12" fill="#d3dceb">demo flow from login to upload to try-on result.</text><text x="443" y="588" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="443" y="606" font-size="12" fill="#d3dceb">API separated from the front end, uploads handled</text><text x="443" y="624" font-size="12" fill="#d3dceb">server-side, secrets kept out of the client</text><text x="443" y="642" font-size="12" fill="#d3dceb">bundle.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.69;1" dur="0.98s" fill="freeze"/><rect x="26" y="674" width="387" height="292" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="42" y="702" font-size="11" fill="#8494b0">HOST-05</text>
    <text x="94.8" y="702" font-size="14" font-weight="700" fill="#d3dceb">law-firm-site</text>
    <rect x="320" y="688" width="77" height="19" rx="4" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="358.5" y="701" font-size="10.5" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">VALIDATING</text><text x="42" y="722" font-size="11.5" fill="#7b8aa3"><tspan fill="#22d3ee">client</tspan> · HTML / CSS / JS / Cloudflare</text><line x1="42" y1="734" x2="397" y2="734" stroke="#1f2b40"/><text x="42" y="756" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="42" y="774" font-size="12" fill="#d3dceb">Replace a template site with a fast, accessible</text><text x="42" y="792" font-size="12" fill="#d3dceb">one the client can trust for leads.</text><text x="42" y="816" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="42" y="834" font-size="12" fill="#d3dceb">Dependency-free static build with a single</text><text x="42" y="852" font-size="12" fill="#d3dceb">layout, deployed to Cloudflare; staging kept out</text><text x="42" y="870" font-size="12" fill="#d3dceb">of search engines.</text><text x="42" y="894" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="42" y="912" font-size="12" fill="#d3dceb">No backend to attack, consent mode for analytics,</text><text x="42" y="930" font-size="12" fill="#d3dceb">legal review gate on privacy policy and terms</text><text x="42" y="948" font-size="12" fill="#d3dceb">before launch.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.73;1" dur="1.1s" fill="freeze"/><rect x="427" y="674" width="387" height="292" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="443" y="702" font-size="11" fill="#8494b0">HOST-06</text>
    <text x="495.8" y="702" font-size="14" font-weight="700" fill="#d3dceb">sports-landing</text>
    <rect x="721" y="688" width="77" height="19" rx="4" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="759.5" y="701" font-size="10.5" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">VALIDATING</text><text x="443" y="722" font-size="11.5" fill="#7b8aa3"><tspan fill="#22d3ee">client</tspan> · HTML / CSS / GSAP / Cloudflare Pages</text><line x1="443" y1="734" x2="798" y2="734" stroke="#1f2b40"/><text x="443" y="756" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="443" y="774" font-size="12" fill="#d3dceb">Present a premium product line with motion,</text><text x="443" y="792" font-size="12" fill="#d3dceb">without a heavy page.</text><text x="443" y="816" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="443" y="834" font-size="12" fill="#d3dceb">Static page with GSAP scroll animation and</text><text x="443" y="852" font-size="12" fill="#d3dceb">optimized media on Cloudflare Pages.</text><text x="443" y="876" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="443" y="894" font-size="12" fill="#d3dceb">Static hosting only, external links isolated, no</text><text x="443" y="912" font-size="12" fill="#d3dceb">third-party form handlers.</text></g>
  </g>
  
</g>
<rect x="0.5" y="0.5" width="839" height="989" rx="10" fill="none" stroke="#1f2b40"/>
</svg>
