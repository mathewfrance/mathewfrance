<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1959" viewBox="0 0 420 1959" role="img" aria-label="case-files — sanitized briefs">
<title>case-files — sanitized briefs</title>
<defs>
  
  <clipPath id="win"><rect width="420" height="1959" rx="10"/></clipPath>
</defs>
<style>text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;}</style>
<g clip-path="url(#win)">
  <rect width="420" height="1959" fill="#0d1524"/>
  <rect width="420" height="34" fill="#111b2e"/>
  <line x1="0" y1="34" x2="420" y2="34" stroke="#1f2b40"/>
  <circle cx="20" cy="17" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="34" y="21.5" font-size="12" fill="#8494b0" letter-spacing="0.5">case-files — sanitized briefs</text>
  <text x="402" y="21.5" font-size="12" fill="#8494b0" text-anchor="end">6 files</text>
  <g>
<text x="22" y="60" font-size="12" fill="#8494b0">$ cat /srv/cases/*.md</text>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="0.5s" fill="freeze"/><rect x="22" y="78" width="376" height="303" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="38" y="106" font-size="11" fill="#8494b0">HOST-01</text>
    <text x="90.8" y="106" font-size="14.5" font-weight="700" fill="#d3dceb">gym-app</text>
    <rect x="317.6" y="92" width="64.4" height="19" rx="4" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="349.8" y="105" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="0.5">BUILDING</text><text x="38" y="126" font-size="12" fill="#7b8aa3"><tspan fill="#22d3ee">personal</tspan> · Cloudflare Pages / Node API (Dock…</text><line x1="38" y1="138" x2="382" y2="138" stroke="#1f2b40"/><text x="38" y="161" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="38" y="180" font-size="12.5" fill="#d3dceb">Log sets and loads at the gym, even with no</text><text x="38" y="199" font-size="12.5" fill="#d3dceb">signal, and see progress over time.</text><text x="38" y="224" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="38" y="243" font-size="12.5" fill="#d3dceb">Offline-first PWA syncing to a containerized</text><text x="38" y="262" font-size="12.5" fill="#d3dceb">Node API; Google sign-in through Supabase</text><text x="38" y="281" font-size="12.5" fill="#d3dceb">Auth.</text><text x="38" y="306" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="38" y="325" font-size="12.5" fill="#d3dceb">Row-level security on every table, JWTs</text><text x="38" y="344" font-size="12.5" fill="#d3dceb">verified via JWKS, read-only containers with</text><text x="38" y="363" font-size="12.5" fill="#d3dceb">dropped capabilities, secret scan in CI.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.52;1" dur="0.62s" fill="freeze"/><rect x="22" y="393" width="376" height="322" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="38" y="421" font-size="11" fill="#8494b0">HOST-02</text>
    <text x="90.8" y="421" font-size="14.5" font-weight="700" fill="#d3dceb">devhome</text>
    <rect x="330.2" y="407" width="51.8" height="19" rx="4" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="356.1" y="420" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">ONLINE</text><text x="38" y="441" font-size="12" fill="#7b8aa3"><tspan fill="#22d3ee">tooling</tspan> · WSL2 / Python / Bash / Claude Code</text><line x1="38" y1="453" x2="382" y2="453" stroke="#1f2b40"/><text x="38" y="476" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="38" y="495" font-size="12.5" fill="#d3dceb">One environment that rebuilds from scratch</text><text x="38" y="514" font-size="12.5" fill="#d3dceb">and tells me when it drifts from a secure</text><text x="38" y="533" font-size="12.5" fill="#d3dceb">baseline.</text><text x="38" y="558" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="38" y="577" font-size="12.5" fill="#d3dceb">Bootstrap scripts, a findings collector with</text><text x="38" y="596" font-size="12.5" fill="#d3dceb">tickets and accepted-risk rules, a lessons KB</text><text x="38" y="615" font-size="12.5" fill="#d3dceb">and AI agent skills.</text><text x="38" y="640" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="38" y="659" font-size="12.5" fill="#d3dceb">Pre-commit secret scanning, findings ranked</text><text x="38" y="678" font-size="12.5" fill="#d3dceb">by severity, every change closed by a</text><text x="38" y="697" font-size="12.5" fill="#d3dceb">verification report.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.59;1" dur="0.74s" fill="freeze"/><rect x="22" y="727" width="376" height="284" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="38" y="755" font-size="11" fill="#8494b0">HOST-03</text>
    <text x="90.8" y="755" font-size="14.5" font-weight="700" fill="#d3dceb">space-agent</text>
    <rect x="317.6" y="741" width="64.4" height="19" rx="4" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="349.8" y="754" font-size="10.5" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="0.5">BUILDING</text><text x="38" y="775" font-size="12" fill="#7b8aa3"><tspan fill="#22d3ee">personal</tspan> · Python / Typer / SQLite / Ollama …</text><line x1="38" y1="787" x2="382" y2="787" stroke="#1f2b40"/><text x="38" y="810" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="38" y="829" font-size="12.5" fill="#d3dceb">An assistant with memory that runs on my</text><text x="38" y="848" font-size="12.5" fill="#d3dceb">machine instead of a third-party cloud.</text><text x="38" y="873" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="38" y="892" font-size="12.5" fill="#d3dceb">Typer CLI over a modular core: SQLite with</text><text x="38" y="911" font-size="12.5" fill="#d3dceb">FTS5 for local search, Ollama for local</text><text x="38" y="930" font-size="12.5" fill="#d3dceb">models, contracts for MCP and webhooks.</text><text x="38" y="955" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="38" y="974" font-size="12.5" fill="#d3dceb">Local models by default, configuration by</text><text x="38" y="993" font-size="12.5" fill="#d3dceb">environment, structured logs for audit.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.65;1" dur="0.86s" fill="freeze"/><rect x="22" y="1023" width="376" height="303" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="38" y="1051" font-size="11" fill="#8494b0">HOST-04</text>
    <text x="90.8" y="1051" font-size="14.5" font-weight="700" fill="#d3dceb">prova.ai</text>
    <rect x="323.9" y="1037" width="58.1" height="19" rx="4" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="352.95" y="1050" font-size="10.5" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">STAGING</text><text x="38" y="1071" font-size="12" fill="#7b8aa3"><tspan fill="#22d3ee">product</tspan> · Next.js / TypeScript / .NET 9 / Do…</text><line x1="38" y1="1083" x2="382" y2="1083" stroke="#1f2b40"/><text x="38" y="1106" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="38" y="1125" font-size="12.5" fill="#d3dceb">Let shoppers preview a garment on themselves</text><text x="38" y="1144" font-size="12.5" fill="#d3dceb">before buying.</text><text x="38" y="1169" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="38" y="1188" font-size="12.5" fill="#d3dceb">Split into landing page, web app and .NET</text><text x="38" y="1207" font-size="12.5" fill="#d3dceb">API; demo flow from login to upload to try-on</text><text x="38" y="1226" font-size="12.5" fill="#d3dceb">result.</text><text x="38" y="1251" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="38" y="1270" font-size="12.5" fill="#d3dceb">API separated from the front end, uploads</text><text x="38" y="1289" font-size="12.5" fill="#d3dceb">handled server-side, secrets kept out of the</text><text x="38" y="1308" font-size="12.5" fill="#d3dceb">client bundle.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.69;1" dur="0.98s" fill="freeze"/><rect x="22" y="1338" width="376" height="322" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="38" y="1366" font-size="11" fill="#8494b0">HOST-05</text>
    <text x="90.8" y="1366" font-size="14.5" font-weight="700" fill="#d3dceb">law-firm-site</text>
    <rect x="305" y="1352" width="77" height="19" rx="4" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="343.5" y="1365" font-size="10.5" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">VALIDATING</text><text x="38" y="1386" font-size="12" fill="#7b8aa3"><tspan fill="#22d3ee">client</tspan> · HTML / CSS / JS / Cloudflare</text><line x1="38" y1="1398" x2="382" y2="1398" stroke="#1f2b40"/><text x="38" y="1421" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="38" y="1440" font-size="12.5" fill="#d3dceb">Replace a template site with a fast,</text><text x="38" y="1459" font-size="12.5" fill="#d3dceb">accessible one the client can trust for</text><text x="38" y="1478" font-size="12.5" fill="#d3dceb">leads.</text><text x="38" y="1503" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="38" y="1522" font-size="12.5" fill="#d3dceb">Dependency-free static build with a single</text><text x="38" y="1541" font-size="12.5" fill="#d3dceb">layout, deployed to Cloudflare; staging kept</text><text x="38" y="1560" font-size="12.5" fill="#d3dceb">out of search engines.</text><text x="38" y="1585" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="38" y="1604" font-size="12.5" fill="#d3dceb">No backend to attack, consent mode for</text><text x="38" y="1623" font-size="12.5" fill="#d3dceb">analytics, legal review gate on privacy</text><text x="38" y="1642" font-size="12.5" fill="#d3dceb">policy and terms before launch.</text></g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.73;1" dur="1.1s" fill="freeze"/><rect x="22" y="1672" width="376" height="265" rx="6" fill="#0a0f1a" stroke="#1f2b40"/><text x="38" y="1700" font-size="11" fill="#8494b0">HOST-06</text>
    <text x="90.8" y="1700" font-size="14.5" font-weight="700" fill="#d3dceb">sports-landing</text>
    <rect x="305" y="1686" width="77" height="19" rx="4" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="343.5" y="1699" font-size="10.5" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">VALIDATING</text><text x="38" y="1720" font-size="12" fill="#7b8aa3"><tspan fill="#22d3ee">client</tspan> · HTML / CSS / GSAP / Cloudflare Pages</text><line x1="38" y1="1732" x2="382" y2="1732" stroke="#1f2b40"/><text x="38" y="1755" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">PROBLEM</text><text x="38" y="1774" font-size="12.5" fill="#d3dceb">Present a premium product line with motion,</text><text x="38" y="1793" font-size="12.5" fill="#d3dceb">without a heavy page.</text><text x="38" y="1818" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#22d3ee">BUILD</text><text x="38" y="1837" font-size="12.5" fill="#d3dceb">Static page with GSAP scroll animation and</text><text x="38" y="1856" font-size="12.5" fill="#d3dceb">optimized media on Cloudflare Pages.</text><text x="38" y="1881" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#34d399">SECURITY</text><text x="38" y="1900" font-size="12.5" fill="#d3dceb">Static hosting only, external links isolated,</text><text x="38" y="1919" font-size="12.5" fill="#d3dceb">no third-party form handlers.</text></g>
  </g>
  
</g>
<rect x="0.5" y="0.5" width="419" height="1958" rx="10" fill="none" stroke="#1f2b40"/>
